{#
  Lucide-style icon library (monochrome, currentColor, stroke 1.8).
  Usage: {% from "components/_icons.html" import icon %} then {{ icon('rocket') }}
  Optional arg: size (default 20), klass (extra classes).
#}

{% macro icon(name, size=20, klass="") %}
<svg class="ic {{ klass }}" width="{{ size }}" height="{{ size }}"
  viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true">
  {%- if name == "rocket" -%}
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
    <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
  {%- elif name == "check" -%}
    <polyline points="20 6 9 17 4 12"/>
  {%- elif name == "circle-check" -%}
    <circle cx="12" cy="12" r="10"/>
    <path d="m9 12 2 2 4-4"/>
  {%- elif name == "circle-dot" -%}
    <circle cx="12" cy="12" r="10"/>
    <circle cx="12" cy="12" r="1" fill="currentColor"/>
  {%- elif name == "circle" -%}
    <circle cx="12" cy="12" r="10"/>
  {%- elif name == "activity" -%}
    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  {%- elif name == "banknote" -%}
    <rect width="20" height="12" x="2" y="6" rx="2"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M6 12h.01"/>
    <path d="M18 12h.01"/>
  {%- elif name == "trending-up" -%}
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
    <polyline points="16 7 22 7 22 13"/>
  {%- elif name == "sparkle" -%}
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
  {%- elif name == "sparkles" -%}
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    <path d="M20 3v4"/>
    <path d="M22 5h-4"/>
    <path d="M4 17v2"/>
    <path d="M5 18H3"/>
  {%- elif name == "layout-grid" -%}
    <rect width="7" height="7" x="3" y="3" rx="1.5"/>
    <rect width="7" height="7" x="14" y="3" rx="1.5"/>
    <rect width="7" height="7" x="14" y="14" rx="1.5"/>
    <rect width="7" height="7" x="3" y="14" rx="1.5"/>
  {%- elif name == "mic" -%}
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" x2="12" y1="19" y2="22"/>
  {%- elif name == "users" -%}
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  {%- elif name == "reply" -%}
    <polyline points="9 17 4 12 9 7"/>
    <path d="M20 18v-2a4 4 0 0 0-4-4H4"/>
  {%- elif name == "shield-check" -%}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  {%- elif name == "globe" -%}
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 2a14.5 14.5 0 0 0 0 20"/>
    <path d="M12 2a14.5 14.5 0 0 1 0 20"/>
    <path d="M2 12h20"/>
  {%- elif name == "flag" -%}
    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
    <line x1="4" x2="4" y1="22" y2="15"/>
  {%- endif -%}
</svg>
{% endmacro %}
