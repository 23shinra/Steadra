<section class="section">
  <div class="section__title">Пароль</div>

  <div class="card card--bento">
    <div class="card__meta">{{ phone }}</div>

    <form
      class="form"
      method="post"
      action="{{ url_for('auth.submit_password') }}"
      hx-post="{{ url_for('auth.submit_password') }}"
      hx-target="#app-content"
      hx-swap="innerHTML"
    >
      {{ form.hidden_tag() }}

      <label class="field">
        <div class="field__label">Пароль</div>
        {{ form.password(class_="input", placeholder="Введите пароль") }}
        {% if form.password.errors %}
          <div class="field__error">{{ form.password.errors[0] }}</div>
        {% endif %}
      </label>

      <button class="btn btn--primary" type="submit">Далее</button>
    </form>
  </div>
</section>
