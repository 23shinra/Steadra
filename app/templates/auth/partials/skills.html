<section class="section">
  <div class="section__title">Профиль</div>

  <div class="card card--bento">
    <form
      class="form"
      method="post"
      action="{{ url_for('auth.submit_skills') }}"
      hx-post="{{ url_for('auth.submit_skills') }}"
      hx-target="#app-content"
      hx-swap="innerHTML"
    >
      {{ form.hidden_tag() }}

      <label class="field">
        <div class="field__label">Имя и фамилия</div>
        {{ form.full_name(class_="input", placeholder="Например: Серик Нуржан") }}
        {% if form.full_name.errors %}
          <div class="field__error">{{ form.full_name.errors[0] }}</div>
        {% endif %}
      </label>

      <label class="field">
        <div class="field__label">Скиллы</div>
        <div class="skills-grid" role="list">
          {% for value,label in form.skills.choices %}
            <label class="skill" role="listitem">
              <input
                class="skill__check"
                type="checkbox"
                name="{{ form.skills.name }}"
                value="{{ value }}"
                {% if value in (form.skills.data or []) %}checked{% endif %}
              />
              <span class="skill__box">
                <span class="skill__icon" aria-hidden="true">
                  {% if value == 'Product' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 3v18"></path><path d="M3 12h18"></path>
                    </svg>
                  {% elif value == 'Founder' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z"></path>
                    </svg>
                  {% elif value == 'Backend' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path>
                    </svg>
                  {% elif value == 'Frontend' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 4h18v16H3z"></path><path d="M7 8h10"></path><path d="M7 12h6"></path>
                    </svg>
                  {% elif value == 'Design' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 3l9 9-9 9-9-9 9-9Z"></path>
                    </svg>
                  {% elif value == 'Growth' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 3v18h18"></path><path d="M7 14l4-4 3 3 6-6"></path>
                    </svg>
                  {% elif value == 'AI' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"></path>
                      <path d="M12 2v2"></path><path d="M12 20v2"></path>
                    </svg>
                  {% elif value == 'Sales' %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 7h18"></path><path d="M7 11h10"></path><path d="M9 15h6"></path>
                    </svg>
                  {% endif %}
                </span>
                <span class="skill__label">{{ label }}</span>
              </span>
            </label>
          {% endfor %}
        </div>
        {% if form.skills.errors %}
          <div class="field__error">{{ form.skills.errors[0] }}</div>
        {% endif %}
      </label>

      <button class="btn btn--primary" type="submit">Готово</button>
    </form>
  </div>
</section>
