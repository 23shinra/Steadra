<section class="section">
  <div class="section__title">Подтверждение</div>

  <div class="card card--bento">
    <div class="card__meta">Отправили код на {{ phone }}</div>

    <form
      class="form"
      method="post"
      action="{{ url_for('auth.submit_code') }}"
      hx-post="{{ url_for('auth.submit_code') }}"
      hx-target="#app-content"
      hx-swap="innerHTML"
    >
      {{ form.hidden_tag() }}

      <label class="field">
        <div class="field__label">Код из SMS</div>
        {{ form.code(class_="input", inputmode="numeric", placeholder="1234") }}
        {% if form.code.errors %}
          <div class="field__error">{{ form.code.errors[0] }}</div>
        {% endif %}
      </label>

      <button class="btn btn--primary" type="submit">Продолжить</button>
    </form>
  </div>
</section>
