{% extends "admin/base_admin.html" %}
{% block title %}{{ partner.name }} · Партнёры{% endblock %}
{% block admin_content %}
<section class="screen stack-lg admin-page">
  <header class="page-title">
    <a class="back-link" href="{{ url_for('admin.partners_page') }}">← Партнёры</a>
    <p class="eyebrow">Правка</p>
    <h1>{{ partner.name }}</h1>
  </header>

  <form class="admin-form stack card" method="post" action="{{ url_for('admin.partner_edit', partner_id=partner.id) }}">
    {{ form.csrf_token }}
    <div class="admin-form__row">
      <label class="field"><span>Название</span>{{ form.name(class_="input") }}</label>
      <label class="field"><span>Категория</span>{{ form.category(class_="input") }}</label>
    </div>
    <label class="field"><span>Описание</span>{{ form.description(class_="input ui-autosize", rows="1") }}</label>
    <div class="admin-form__row">
      <label class="field"><span>URL</span>{{ form.url(class_="input") }}</label>
      <label class="field"><span>Регион</span>{{ form.region(class_="input") }}</label>
    </div>
    <div class="admin-form__row">
      <label class="field"><span>Шаг карты</span>{{ form.roadmap_step_key(class_="input") }}</label>
      <label class="field"><span>Порядок</span>{{ form.sort_order(class_="input") }}</label>
    </div>
    <label class="checkbox-row ui-check">
      {{ form.active(class_="ui-check__input") }}
      {% include "components/_ui_check_box.html" %}
      <span>Активен</span>
    </label>
    <button class="btn btn-primary" type="submit">Сохранить</button>
  </form>
</section>
{% endblock %}
