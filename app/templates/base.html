<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kangaroo" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{% block title %}Kangaroo{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}" />
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=config.ASSET_VERSION) }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="{{ url_for('static', filename='js/app.js', v=config.ASSET_VERSION) }}" defer></script>
  </head>
  <body class="{% if is_admin %}is-admin{% elif hide_nav %}is-landing{% elif is_chat %}is-chat{% endif %}">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main class="phone-frame">
      {% block content %}{% endblock %}
    </main>
    {% if not hide_nav and not is_admin %}
      {% if is_investor_user %}
        {% include "components/nav_investor.html" %}
      {% else %}
        {% include "components/nav.html" %}
      {% endif %}
    {% endif %}
    {% block page_scripts %}{% endblock %}
  </body>
</html>
