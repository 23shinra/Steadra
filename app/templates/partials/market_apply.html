<section class="section">
  <div class="section__title">Отклик</div>

  <div class="card">
    <div class="card__title">{{ order['title'] }}</div>
    <div class="meta-row meta-row--sub">
      <span class="badge">{{ order['format']|upper }}</span>
      <span class="badge badge--muted">{{ category_labels.get(order['category'], order['category']) }}</span>
      {% if order['budget'] %}
        <span class="dot">•</span>
        <span class="meta meta--strong">{{ order['budget'] }}</span>
      {% endif %}
    </div>
  </div>

  <form
    class="form"
    method="post"
    action="{{ url_for('main.market_apply', order_id=order['id']) }}"
    hx-post="{{ url_for('main.market_apply', order_id=order['id']) }}"
    hx-target="#toast-root"
    hx-swap="beforeend"
  >
    {{ form.hidden_tag() }}

    <label class="field">
      <div class="field__label">Сообщение</div>
      {{ form.message(class_="textarea", rows="6", placeholder="Коротко: релевантный опыт, как решите задачу, сроки") }}
      {% if form.message.errors %}
        <div class="field__error">{{ form.message.errors[0] }}</div>
      {% endif %}
    </label>

    <label class="field">
      <div class="field__label">Ставка/условия</div>
      {{ form.rate(class_="input", placeholder="Например: $600, 7 дней, 2 итерации правок") }}
      {% if form.rate.errors %}
        <div class="field__error">{{ form.rate.errors[0] }}</div>
      {% endif %}
    </label>

    <label class="field">
      <div class="field__label">Портфолио (ссылка)</div>
      {{ form.portfolio_url(class_="input", placeholder="https://...") }}
      {% if form.portfolio_url.errors %}
        <div class="field__error">{{ form.portfolio_url.errors[0] }}</div>
      {% endif %}
    </label>

    <div class="row">
      <a
        class="btn btn--ghost"
        href="{{ url_for('main.market_detail', order_id=order['id']) }}"
        hx-get="{{ url_for('main.market_detail', order_id=order['id']) }}"
        hx-target="#app-content"
        hx-push-url="true"
        hx-swap="innerHTML"
      >← К заказу</a>

      <button class="btn btn--primary" type="submit">Отправить отклик</button>
    </div>
  </form>
</section>
