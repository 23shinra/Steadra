<section class="section">
  <div class="section__title">Биржа заказов</div>

  <div class="toolbar">
    <a
      class="btn btn--primary"
      href="{{ url_for('main.create_order') }}"
      hx-get="{{ url_for('main.create_order') }}"
      hx-target="#app-content"
      hx-push-url="true"
      hx-swap="innerHTML"
    >
      + Разместить заказ
    </a>
  </div>

  <form
    id="market-filters"
    class="filters"
    hx-get="{{ url_for('main.ui_tab', tab='market') }}"
    hx-target="#market-list"
    hx-select="#market-list"
    hx-swap="outerHTML"
    hx-push-url="true"
    hx-indicator="#market-loading"
  >
    <input
      class="input"
      type="search"
      name="q"
      value="{{ filters.q }}"
      placeholder="Поиск по заказам"
      hx-trigger="keyup changed delay:350ms"
    />

    <div class="grid-2">
      <select class="select" name="format">
        <option value="">Формат: любой</option>
        <option value="online" {{ 'selected' if filters.format=='online' else '' }}>Онлайн</option>
        <option value="offline" {{ 'selected' if filters.format=='offline' else '' }}>Оффлайн</option>
        <option value="hybrid" {{ 'selected' if filters.format=='hybrid' else '' }}>Гибрид</option>
      </select>

      <select class="select" name="category">
        <option value="">Категория: любая</option>
        {% for key,label in category_labels.items() %}
          <option value="{{ key }}" {{ 'selected' if filters.category==key else '' }}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid-2">
      <select class="select" name="duration">
        <option value="">Длительность: любая</option>
        <option value="oneoff" {{ 'selected' if filters.duration=='oneoff' else '' }}>Разовый</option>
        <option value="long" {{ 'selected' if filters.duration=='long' else '' }}>Долгосрочно</option>
      </select>

      <select class="select" name="performer">
        <option value="">Исполнитель: любой</option>
        <option value="solo" {{ 'selected' if filters.performer=='solo' else '' }}>Соло</option>
        <option value="team" {{ 'selected' if filters.performer=='team' else '' }}>Команда</option>
        <option value="agency" {{ 'selected' if filters.performer=='agency' else '' }}>Агентство</option>
      </select>
    </div>

    <div class="row">
      <button class="btn btn--secondary" type="submit">Применить</button>
      <a class="btn btn--ghost" href="{{ url_for('main.ui_tab', tab='market') }}"
         hx-get="{{ url_for('main.ui_tab', tab='market') }}"
         hx-target="#app-content"
         hx-push-url="true"
         hx-swap="innerHTML"
      >Сброс</a>
    </div>
  </form>

  <div id="market-loading" class="htmx-indicator">
    <div class="skeleton-list">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <div id="market-list">
    {% include "partials/market_list.html" %}
  </div>
</section>
