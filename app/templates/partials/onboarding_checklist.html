{% if onboarding %}
<article class="onboarding-checklist card">
  <div class="section-head">
    <h2>Старт в Kangaroo</h2>
    <span class="muted">{{ onboarding.done_count }}/{{ onboarding.total }}</span>
  </div>
  <ul class="onboarding-checklist__list">
    {% for item in onboarding.tasks %}
    <li class="onboarding-checklist__item{% if item.done %} is-done{% endif %}">
      {% include "components/_ui_check_box.html" %}
      {% if item.done %}
      <span>{{ item.label }}</span>
      {% else %}
      <a href="{{ item.href }}">{{ item.label }}</a>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</article>
{% endif %}
