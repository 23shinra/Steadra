{% if weekly_goals %}
<section class="step-goals card" id="step-goals">
  <div class="section-head">
    <h2>Задачи на неделю</h2>
    <span class="muted" id="step-goals-count">{{ weekly_goals.done }}/{{ weekly_goals.total }}</span>
  </div>
  <ul class="step-goals__list">
    {% for goal in weekly_goals.goals %}
    <li class="step-goals__item{% if goal.done %} is-done{% endif %}" data-goal-id="{{ goal.id }}">
      <form
        method="post"
        action="{{ url_for('main.progress_goal_toggle', goal_id=goal.id) }}"
        hx-post="{{ url_for('main.progress_goal_toggle', goal_id=goal.id) }}"
        hx-swap="none"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="startup_id" value="{{ progress_startup.id }}" />
        <button type="submit" class="step-goals__toggle" aria-pressed="{{ 'true' if goal.done else 'false' }}">
          {% include "components/_ui_check_box.html" %}
          <span>{{ goal.label }}</span>
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
  <div id="step-goals-cta-wrap" class="step-goals__cta-wrap{% if weekly_goals.done %} is-open{% endif %}">
    <div class="step-goals__cta-slot">
      {% include "partials/step_goals_cta.html" %}
    </div>
  </div>
</section>
{% endif %}
