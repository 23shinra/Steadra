{% if progress_startup %}
<div class="chat-map-toggle{% if ask_map_confirm or suggest_via_map %} is-suggested{% endif %}{% if ask_map_confirm %} is-confirm{% endif %}" id="chat-map-toggle" hx-swap-oob="true">
  <label class="chat-map-toggle__label ui-check" for="chat-via-map">
    <input type="checkbox" class="ui-check__input" id="chat-via-map" name="via_map" value="1" checked />
    {% include "components/_ui_check_box.html" %}
    <span>По карте прогресса</span>
  </label>
  {% if ask_map_confirm and map_confirm_hint %}
  <p class="chat-map-toggle__suggest">{{ map_confirm_hint }}</p>
  {% elif suggest_via_map and map_hint %}
  <p class="chat-map-toggle__suggest">{{ map_hint }}</p>
  {% else %}
  <span class="chat-map-toggle__help">
    <button
      type="button"
      class="chat-map-toggle__help-btn"
      data-map-help
      aria-label="Что значит «По карте прогресса»"
      aria-expanded="false"
      aria-controls="chat-map-help-tip"
    >?</button>
    <span class="chat-map-toggle__tip" id="chat-map-help-tip" role="tooltip">
      Включено — ответы по шагам ветки
    </span>
  </span>
  {% endif %}
</div>
{% endif %}
